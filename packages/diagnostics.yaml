debug:
  update_interval: 60s

sensor:
  - platform: uptime
    name: Gateway Uptime
  - platform: internal_temperature
    name: ESP32-C6 Die Temperature
  - platform: debug
    free:
      name: Free Heap
    min_free:
      name: Minimum Free Heap
    block:
      name: Largest Free Heap Block
    fragmentation:
      name: Heap Fragmentation
    loop_time:
      name: Maximum Loop Time

text_sensor:
  - platform: version
    name: Firmware Build
  - platform: debug
    reset_reason:
      name: Reset Reason

honeywell_activlink:
  diagnostic_update_interval: 60s
  valid_frames:
    name: ActivLink Valid Frames
  decode_failures:
    name: ActivLink Decode Failures
  candidate_rows:
    name: ActivLink Candidate Rows
  duplicate_frames:
    name: ActivLink Duplicate Frames
  unconfigured_frames:
    name: ActivLink Unconfigured Frames
  radio_recoveries:
    name: ActivLink Radio Recoveries
  last_valid_frame_age:
    name: ActivLink Last Valid Frame Age
  last_capture_summary:
    name: ActivLink Last Rejected Capture
