[project]
name = "esphome-honeywell-activlink"
version = "0.1.0"
description = "ESPHome gateway for Honeywell ActivLink transmitters using an ESP32-C6 and CC1101"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "esphome==2026.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.uv]
package = false
required-version = ">=0.9.0"
