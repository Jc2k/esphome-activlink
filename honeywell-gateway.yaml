substitutions:
  firmware_version: "0.0.0-dev"
  # Adafruit ESP32-C6 Feather labels: SCK, MO, MI, A3, and SCL.
  spi_clk_pin: GPIO21
  spi_mosi_pin: GPIO22
  spi_miso_pin: GPIO23
  cc1101_cs_pin: GPIO5
  # Module pin 3 (GDO0) is the proven receive-data path on Feather SCL.
  cc1101_rx_pin: GPIO18

packages:
  core: !include packages/core.yaml
  network: !include packages/thread.yaml

honeywell_activlink:
  api_encryption_key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
