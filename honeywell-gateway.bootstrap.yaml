substitutions:
  firmware_version: "0.0.0-dev"
  # Adafruit ESP32-C6 Feather labels: SCK, MO, MI, A3, and GPIO14.
  spi_clk_pin: GPIO21
  spi_mosi_pin: GPIO22
  spi_miso_pin: GPIO23
  cc1101_cs_pin: GPIO5
  cc1101_rx_pin: GPIO14

packages:
  core: !include packages/core.yaml
  network: !include packages/wifi.yaml
  security: !include packages/security-bootstrap.yaml

esphome:
  build_path: build/honeywell-activlink-bootstrap

# Persist the existing Home Assistant API key into encrypted NVS. Wi-Fi
# credentials arrive separately through BLE Improv and are never compiled in.
honeywell_activlink:
  api_encryption_key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
