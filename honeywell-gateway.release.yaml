substitutions:
  firmware_version: "0.0.0-dev"
  # Adafruit ESP32-C6 Feather labels: SCK, MO, MI, A3, and GPIO14.
  spi_clk_pin: GPIO21
  spi_mosi_pin: GPIO22
  spi_miso_pin: GPIO23
  cc1101_cs_pin: GPIO5
  cc1101_rx_pin: GPIO14

packages:
  core: !include packages/core.yaml
  network: !include packages/thread-retained.yaml
  native_ipv6: !include packages/native-ipv6.yaml
  security: !include packages/security-production.yaml
  updates: !include packages/managed-updates.yaml

esphome:
  build_path: build/honeywell-activlink-production

# The public image contains neither the Thread dataset nor API key. Both are
# loaded from the encrypted NVS established by the private bootstrap image.
