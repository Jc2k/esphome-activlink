substitutions:
  firmware_version: "0.0.0-dev"
  # Adafruit ESP32-C6 Feather labels: SCK, MO, MI, A3, and GPIO14.
  spi_clk_pin: GPIO21
  spi_mosi_pin: GPIO22
  spi_miso_pin: GPIO23
  cc1101_cs_pin: GPIO5
  cc1101_rx_pin: GPIO14

packages:
  core: !include packages/core.yaml
  network: !include packages/wifi.yaml
  security: !include packages/security-production.yaml
  updates: !include packages/managed-updates.yaml

esphome:
  build_path: build/honeywell-activlink-production

# Keep production diagnostics available on the native USB Serial/JTAG console
# so BLE Improv and Wi-Fi recovery remain observable when the native API is
# offline.
logger:
  baud_rate: 115200

# The public image contains no Wi-Fi credentials or API key. BLE Improv stores
# Wi-Fi credentials at runtime; the API key is loaded from encrypted NVS.
