substitutions:
  firmware_version: "0.0.0-dev"
  # Adafruit ESP32-C6 Feather labels: SCK, MO, MI, A3, and SCL.
  spi_clk_pin: GPIO21
  spi_mosi_pin: GPIO22
  spi_miso_pin: GPIO23
  cc1101_cs_pin: GPIO5
  cc1101_rx_pin: GPIO18

packages:
  core: !include packages/core.yaml

# Credentials provisioned by the local build are retained in flash across OTA.
# Never put private credentials into this publicly downloadable build.
wifi:

improv_serial:

provisioning:
  timeout: 5min

ota:
  - platform: http_request
