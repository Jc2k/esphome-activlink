substitutions:
  firmware_version: "0.0.0-dev"
  # Adafruit ESP32-C6 Feather labels: SCK, MO, MI, A3, and GPIO14.
  spi_clk_pin: GPIO21
  spi_mosi_pin: GPIO22
  spi_miso_pin: GPIO23
  cc1101_cs_pin: GPIO5
  cc1101_rx_pin: GPIO14

packages:
  core: !include packages/core.yaml
  network: !include packages/thread.yaml
  native_ipv6: !include packages/native-ipv6.yaml
  security: !include packages/security-production.yaml
  updates: !include packages/managed-updates.yaml

esphome:
  build_path: build/honeywell-activlink-migration

# Unlike the one-time bootstrap, this image is hardware-Secure-Boot compatible
# and deliberately replaces a dataset already stored in encrypted NVS.
openthread:
  force_dataset: true

honeywell_activlink:
  api_encryption_key: !secret api_encryption_key
